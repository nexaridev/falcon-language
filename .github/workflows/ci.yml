name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and run Falcon tests
        run: bash ./build.sh
      - name: Verify Maven package
        run: mvn --batch-mode verify
      - name: Run VS Code language tests
        run: node --test editors/vscode/test/language.test.js
      - name: Compile the Windows setup program
        run: dotnet build installer/FalconSetup.csproj --configuration Release
